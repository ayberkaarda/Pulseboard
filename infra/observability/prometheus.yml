global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Spring Boot actuator on the management port (not published outside the Docker network).
  - job_name: api-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-core:8081"]

  # Internal metrics listener of the analytics service (METRICS_PORT, default 9100).
  - job_name: analytics
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics:9100"]
