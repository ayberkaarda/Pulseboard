name: pulseboard

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseboard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be non-empty}
      PULSEBOARD_DB_NAME: ${POSTGRES_DB:-pulseboard}
      API_CORE_DB_PASSWORD: ${API_CORE_DB_PASSWORD:?API_CORE_DB_PASSWORD must be non-empty}
      ANALYTICS_READER_DB_PASSWORD: ${ANALYTICS_READER_DB_PASSWORD:?ANALYTICS_READER_DB_PASSWORD must be non-empty}
      ANALYTICS_WRITER_DB_PASSWORD: ${ANALYTICS_WRITER_DB_PASSWORD:?ANALYTICS_WRITER_DB_PASSWORD must be non-empty}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be non-empty}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be non-empty}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api-core:
    build:
      context: ../apps/api-core
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-pulseboard}
      DB_USERNAME: api_core
      DB_PASSWORD: ${API_CORE_DB_PASSWORD:?API_CORE_DB_PASSWORD must be non-empty}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be non-empty}
      ANALYTICS_BASE_URL: http://analytics:8000
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be non-empty}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be non-empty}
      # Optional live stream and internal endpoint limits (defaults shown).
      ANOMALY_STREAM_MAX_PER_TENANT: ${ANOMALY_STREAM_MAX_PER_TENANT:-10}
      ANOMALY_STREAM_MAX_TOTAL: ${ANOMALY_STREAM_MAX_TOTAL:-500}
      ANOMALY_STREAM_HEARTBEAT: ${ANOMALY_STREAM_HEARTBEAT:-30s}
      ANOMALY_STREAM_MAX_LIFETIME: ${ANOMALY_STREAM_MAX_LIFETIME:-30m}
      STREAM_TICKET_TTL: ${STREAM_TICKET_TTL:-30s}
      STREAM_TICKET_ISSUE_CAPACITY: ${STREAM_TICKET_ISSUE_CAPACITY:-30}
      STREAM_TICKET_ISSUE_PERIOD: ${STREAM_TICKET_ISSUE_PERIOD:-1m}
      # Absolute session lifetime from login; must be at least the 7 day refresh token TTL.
      REFRESH_FAMILY_TTL: ${REFRESH_FAMILY_TTL:-30d}
      INTERNAL_MAX_BODY_BYTES: ${INTERNAL_MAX_BODY_BYTES:-524288}
      # HMAC key for signed alert webhooks (X-Pulseboard-Signature), at least 32 characters.
      ALERT_WEBHOOK_SIGNING_SECRET: ${ALERT_WEBHOOK_SIGNING_SECRET:?ALERT_WEBHOOK_SIGNING_SECRET must be non-empty (at least 32 characters)}
      # Optional alerting settings (defaults shown, identical to application.yml).
      ALERT_WEBHOOK_ALLOWED_PORTS: ${ALERT_WEBHOOK_ALLOWED_PORTS:-443}
      ALERT_MAX_RULES_PER_TENANT: ${ALERT_MAX_RULES_PER_TENANT:-50}
      ALERT_DISPATCHER_ENABLED: ${ALERT_DISPATCHER_ENABLED:-true}
      ALERT_DISPATCH_INTERVAL: ${ALERT_DISPATCH_INTERVAL:-5s}
      ALERT_DISPATCH_MAX_ATTEMPTS: ${ALERT_DISPATCH_MAX_ATTEMPTS:-4}
      ALERT_EVENTS_PER_PERIOD: ${ALERT_EVENTS_PER_PERIOD:-600}
      ALERT_EVENTS_PERIOD: ${ALERT_EVENTS_PERIOD:-1h}
      # ALERT_WEBHOOK_ALLOW_HTTP and ALERT_WEBHOOK_ALLOW_PRIVATE_TARGETS are deliberately not passed through:
      # api-core refuses to start with them outside the test and local profiles, and this stack must not set them.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [backend, frontend]

  analytics:
    build:
      context: ../services/analytics
    restart: unless-stopped
    environment:
      DATABASE_READER_URL: postgresql+psycopg://analytics_reader:${ANALYTICS_READER_DB_PASSWORD:?ANALYTICS_READER_DB_PASSWORD must be non-empty}@postgres:5432/${POSTGRES_DB:-pulseboard}
      DATABASE_WRITER_URL: postgresql+psycopg://analytics_writer:${ANALYTICS_WRITER_DB_PASSWORD:?ANALYTICS_WRITER_DB_PASSWORD must be non-empty}@postgres:5432/${POSTGRES_DB:-pulseboard}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be non-empty}@redis:6379/0
      API_CORE_BASE_URL: http://api-core:8080
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be non-empty}
      # The scheduler runs inside the process, so this service must stay a single replica.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCORE_INTERVAL_SECONDS: ${SCORE_INTERVAL_SECONDS:-60}
      SCORE_LOCK_TTL_MS: ${SCORE_LOCK_TTL_MS:-55000}
      SCORE_DEADLINE_SECONDS: ${SCORE_DEADLINE_SECONDS:-50}
      SCORE_LEASE_MARGIN_SECONDS: ${SCORE_LEASE_MARGIN_SECONDS:-5}
      METRIC_LOCK_TIMEOUT_SECONDS: ${METRIC_LOCK_TIMEOUT_SECONDS:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      FOREST_CACHE_MAX: ${FOREST_CACHE_MAX:-256}
      VERIFY_DB_ROLES: ${VERIFY_DB_ROLES:-true}
    deploy:
      replicas: 1
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [backend]

  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [frontend]

networks:
  backend:
  frontend:

volumes:
  pgdata:
