name: pulseboard

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseboard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be non-empty}
      PULSEBOARD_DB_NAME: ${POSTGRES_DB:-pulseboard}
      API_CORE_DB_PASSWORD: ${API_CORE_DB_PASSWORD:?API_CORE_DB_PASSWORD must be non-empty}
      ANALYTICS_READER_DB_PASSWORD: ${ANALYTICS_READER_DB_PASSWORD:?ANALYTICS_READER_DB_PASSWORD must be non-empty}
      ANALYTICS_WRITER_DB_PASSWORD: ${ANALYTICS_WRITER_DB_PASSWORD:?ANALYTICS_WRITER_DB_PASSWORD must be non-empty}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api-core:
    build:
      context: ../apps/api-core
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-pulseboard}
      DB_USERNAME: api_core
      DB_PASSWORD: ${API_CORE_DB_PASSWORD:?API_CORE_DB_PASSWORD must be non-empty}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ANALYTICS_BASE_URL: http://analytics:8000
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be non-empty}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be non-empty}
    ports:
      - "${API_CORE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [backend, frontend]

  analytics:
    build:
      context: ../services/analytics
    restart: unless-stopped
    environment:
      DATABASE_READER_URL: postgresql+psycopg://analytics_reader:${ANALYTICS_READER_DB_PASSWORD:?ANALYTICS_READER_DB_PASSWORD must be non-empty}@postgres:5432/${POSTGRES_DB:-pulseboard}
      DATABASE_WRITER_URL: postgresql+psycopg://analytics_writer:${ANALYTICS_WRITER_DB_PASSWORD:?ANALYTICS_WRITER_DB_PASSWORD must be non-empty}@postgres:5432/${POSTGRES_DB:-pulseboard}
      REDIS_URL: redis://redis:6379/0
      API_CORE_BASE_URL: http://api-core:8080
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be non-empty}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [backend]

  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [frontend]

networks:
  backend:
  frontend:

volumes:
  pgdata:
