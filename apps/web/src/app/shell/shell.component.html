<button type="button" class="skip-link" (click)="skipToContent()">Skip to content</button>

<mat-sidenav-container class="shell">
  <mat-sidenav
    class="rail"
    [mode]="wide() ? 'side' : 'over'"
    [opened]="wide() || drawerOpen()"
    (openedChange)="drawerOpen.set($event)"
    [disableClose]="wide()"
  >
    <div class="brand">
      <app-brand-mark [animate]="true" />
      <span class="pb-wordmark">pulseboard</span>
    </div>

    <nav class="nav" aria-label="Primary">
      <ul>
        @for (item of navItems; track item.link) {
          <li>
            <a
              class="nav-item"
              [routerLink]="item.link"
              [class.active]="isActive(item)"
              [attr.aria-current]="isActive(item) ? 'page' : null"
            >
              <app-icon [name]="item.icon" />
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="rail-footer">
      <button type="button" class="nav-item" (click)="openSignalKey()">
        <app-icon name="key" />
        <span>Signal key</span>
      </button>
      <app-theme-switch />
      <button type="button" class="nav-item" (click)="signOut()">
        <app-icon name="logout" />
        <span>Sign out</span>
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    @if (!wide()) {
      <header class="topbar">
        <button
          mat-icon-button
          type="button"
          aria-label="Open navigation"
          [attr.aria-expanded]="drawerOpen()"
          (click)="drawerOpen.set(true)"
        >
          <app-icon name="menu" />
        </button>
        <app-brand-mark />
        <span class="pb-wordmark">pulseboard</span>
      </header>
    }

    <main #main id="main" class="main" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
