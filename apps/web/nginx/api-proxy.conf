# Shared by the API locations. The upstream is resolved per request so nginx starts before api-core.
set $api_core_upstream http://api-core:8080;
proxy_pass $api_core_upstream;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# The browser gets the security headers from this proxy once, not from both ends.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
include /etc/nginx/snippets/security-headers.conf;
