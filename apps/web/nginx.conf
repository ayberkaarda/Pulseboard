# Access log for the API without the query string: a stream ticket travels there and must not be stored.
log_format api '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  # text/event-stream is deliberately absent: compressing a stream holds events back.
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  # Docker embedded DNS; resolving at request time lets nginx start before api-core is up.
  resolver 127.0.0.11 valid=30s ipv6=off;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Service to service routes (HMAC signed calls from analytics) are never reachable from a browser.
  # nginx matches the decoded and normalised path, so %69nternal, //internal and /api/../internal land here too.
  location ^~ /internal {
    default_type text/plain;
    return 404;
  }

  # Live anomaly stream (Server-Sent Events): no buffering, no compression, long timeouts.
  location = /api/v1/stream/anomalies {
    access_log /var/log/nginx/access.log api;
    # An error line carries the request line and the upstream URL, both with the ?ticket= query. Only
    # critical entries are written for this location, so a failed upstream connection (level error)
    # cannot store a ticket that is still valid. The cost: no upstream error lines for the stream.
    error_log /var/log/nginx/error.log crit;
    gzip off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    include /etc/nginx/snippets/api-proxy.conf;
    add_header X-Accel-Buffering "no" always;
  }

  # ^~ stops regex locations (static asset caching below) from capturing /api/ paths such as *.js.
  location ^~ /api/ {
    access_log /var/log/nginx/access.log api;
    # Explicit limit above api-core's 512 KiB ingest body limit, with headroom; api-core enforces the exact limit.
    client_max_body_size 1m;
    gzip off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    include /etc/nginx/snippets/api-proxy.conf;
  }

  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
    try_files $uri =404;
    expires 1y;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  # The shell is never cached: it names the hashed bundles of the current build.
  location = /index.html {
    sub_filter '__CSP_NONCE__' $request_id;
    sub_filter_once off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    # Angular stamps this nonce on the style elements it creates; the CSP header carries the same value.
    sub_filter '__CSP_NONCE__' $request_id;
    sub_filter_once off;
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
