# Test-profile overrides. Kept under src/test so none of these values ship in the application jar.
pulseboard:
  security:
    jwt:
      # Random per test JVM: two 32-hex-character random values give a 64-byte HS256 key.
      secret: ${random.value}${random.value}
  internal:
    # Random per test JVM (64 hex characters); tests read it back through the environment property.
    shared-secret: ${random.value}${random.value}
  stream:
    # Short heartbeat so a test sees one within moments; the dedicated stream tests use their own limits.
    heartbeat-interval: 300ms
    max-per-tenant: 4
  rate-limit:
    auth:
      # Every test request comes from the loopback address, so the per-client bucket is effectively disabled
      # here; AuthClientRateLimitIntegrationTest covers it with its own small limit. The per-account limit
      # keeps its production value.
      client-capacity: 1000000
    api-key:
      # Same reason: all suites share the loopback client. ApiKeyClientRateLimitIntegrationTest covers both
      # per-client buckets with small limits in its own context.
      client-capacity: 1000000
      invalid-capacity: 1000000
    query:
      # Query tests share few tenants per class only, but keep them clear of the quota; the quota is covered by
      # MetricQueryLimitsIntegrationTest in its own context.
      tenant-capacity: 1000000
