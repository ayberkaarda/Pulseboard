spring:
  application:
    name: api-core
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pulseboard}
    username: ${DB_USERNAME:api_core}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: api-core-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: false

logging:
  level:
    io.pulseboard: DEBUG

# Developer workstation only: full health details help diagnose local Postgres/Redis wiring.
management:
  endpoint:
    health:
      show-details: always
      show-components: always

---
spring:
  config:
    activate:
      on-profile: test

logging:
  level:
    io.pulseboard: DEBUG
    org.testcontainers: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:pulseboard}
  data:
    redis:
      host: ${REDIS_HOST:redis}

logging:
  level:
    root: INFO
    io.pulseboard: INFO

# Container deployments never expose health internals to anonymous callers.
management:
  endpoint:
    health:
      show-details: never
      show-components: never
