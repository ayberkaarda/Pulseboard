spring:
  application:
    name: api-core
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pulseboard}
    username: ${DB_USERNAME:api_core}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: api-core-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # The client address (used for per-client rate limits) is taken from X-Forwarded-For only when the direct peer
  # is a trusted proxy. Default: the private ranges Docker networks use (the web nginx container). Loopback and
  # public addresses are not trusted, so a client talking to api-core directly cannot choose its address.
  # When api-core is reachable directly from a private network, narrow TRUSTED_PROXIES to the proxy's address.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}}
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
  error:
    include-stacktrace: never
    include-message: never

management:
  # Actuator (health, info, prometheus) is served only on this port, which is not published outside the
  # container network. The application port exposes no actuator endpoints.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
  # The exported contract (contracts/api-core.openapi.yaml) must be byte-for-byte reproducible.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  # Error responses are documented per operation; the advice's handlers do not apply to every operation.
  override-with-generic-response: false

pulseboard:
  security:
    jwt:
      # HS256 signing key; required in every profile and never defaulted (at least 32 bytes).
      secret: ${JWT_SECRET:}
      issuer: pulseboard-api-core
      audience: pulseboard-api
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      # Absolute session lifetime counted from login: rotation never extends a refresh token beyond it, and a
      # refresh after it answers 401 and revokes the family. Must not be shorter than refresh-token-ttl.
      refresh-family-ttl: ${REFRESH_FAMILY_TTL:30d}
  partitions:
    # Monthly metric_point partitions are kept this many months ahead of the current UTC month.
    months-ahead: ${METRIC_PARTITIONS_MONTHS_AHEAD:3}
    # Daily at 00:15 UTC (second minute hour day month weekday); also run once at startup.
    cron: ${METRIC_PARTITIONS_CRON:0 15 0 * * *}
  rate-limit:
    auth:
      # Register, login, refresh and logout requests per client address (shared bucket): 30 per minute.
      client-capacity: ${AUTH_RATE_LIMIT_CLIENT_CAPACITY:30}
      client-refill-period: ${AUTH_RATE_LIMIT_CLIENT_PERIOD:1m}
      # Login attempts per tenant slug + email, checked before password hashing: 10 per 15 minutes.
      account-capacity: ${AUTH_RATE_LIMIT_ACCOUNT_CAPACITY:10}
      account-refill-period: ${AUTH_RATE_LIMIT_ACCOUNT_PERIOD:15m}
    query:
      # Metric queries per tenant (all its users share the bucket): 120 per minute.
      tenant-capacity: ${METRIC_QUERY_RATE_LIMIT_CAPACITY:120}
      refill-period: ${METRIC_QUERY_RATE_LIMIT_PERIOD:1m}
    api-key:
      # Requests carrying X-Api-Key per client address, applied before the key is looked up: 1200 per minute.
      client-capacity: ${API_KEY_RATE_LIMIT_CLIENT_CAPACITY:1200}
      client-refill-period: ${API_KEY_RATE_LIMIT_CLIENT_PERIOD:1m}
      # Failed API key authentications per client address; when exhausted, keys from that client are not even
      # looked up: 20 per minute.
      invalid-capacity: ${API_KEY_RATE_LIMIT_INVALID_CAPACITY:20}
      invalid-refill-period: ${API_KEY_RATE_LIMIT_INVALID_PERIOD:1m}
  query:
    # Transaction-local statement_timeout of a metric query; exceeding it answers 503 query-timeout.
    statement-timeout: ${METRIC_QUERY_STATEMENT_TIMEOUT:5s}
  ingest:
    # Raw request body limit. A full batch (1000 points) is about 120 KB of compact JSON.
    max-body-bytes: ${INGEST_MAX_BODY_BYTES:524288}
    # Batches per tenant per refill period (token bucket in Redis): FREE 60/min, PRO 600/min.
    free-batch-capacity: ${INGEST_RATE_LIMIT_FREE_CAPACITY:60}
    pro-batch-capacity: ${INGEST_RATE_LIMIT_PRO_CAPACITY:600}
    refill-period: ${INGEST_RATE_LIMIT_PERIOD:1m}
  api-key-cache:
    # Successful API key authentications are cached in Redis for this long.
    ttl: ${API_KEY_CACHE_TTL:60s}
    # Revocation markers replace cached results immediately and outlive them by far.
    revoked-marker-ttl: ${API_KEY_CACHE_REVOKED_MARKER_TTL:24h}
  internal:
    # HMAC-SHA256 key shared with the analytics service; required, at least 32 characters, never defaulted.
    shared-secret: ${INTERNAL_SHARED_SECRET:}
    # Bodies larger than this are rejected before they are hashed. 500 notifications are about 200 KB.
    max-body-bytes: ${INTERNAL_MAX_BODY_BYTES:524288}
  alert:
    # Alert rules a tenant may own.
    max-rules-per-tenant: ${ALERT_MAX_RULES_PER_TENANT:50}
    # Rules of one metric, and rules over a whole ingestion batch, that are evaluated per batch (bounded work).
    max-rules-per-metric: ${ALERT_MAX_RULES_PER_METRIC:20}
    max-rules-per-batch: ${ALERT_MAX_RULES_PER_BATCH:200}
    # Enabled rules of a metric are reused between batches for this long; a change on another instance is seen
    # after at most this time.
    rule-cache-ttl: ${ALERT_RULE_CACHE_TTL:5s}
    # Points outside this window around now never raise a threshold alert (back-filled history is not news).
    max-point-age: ${ALERT_MAX_POINT_AGE:1h}
    max-point-future: ${ALERT_MAX_POINT_FUTURE:5m}
    # Alert events one tenant may create; over the budget events are dropped and counted.
    events-per-period: ${ALERT_EVENTS_PER_PERIOD:600}
    events-period: ${ALERT_EVENTS_PERIOD:1h}
    dispatcher:
      # Polling delivery of pending events; every instance may run it, claims never overlap.
      enabled: ${ALERT_DISPATCHER_ENABLED:true}
      poll-interval: ${ALERT_DISPATCH_INTERVAL:5s}
      batch-size: ${ALERT_DISPATCH_BATCH_SIZE:10}
      # Deliveries running at the same time.
      concurrency: ${ALERT_DISPATCH_CONCURRENCY:4}
      # A claim that is not finished within the lease is taken over (crash recovery); longer than delivery-timeout.
      lease: ${ALERT_DISPATCH_LEASE:60s}
      # Attempts per event, the first included: the first try plus 3 retries.
      max-attempts: ${ALERT_DISPATCH_MAX_ATTEMPTS:4}
      # Wait before attempt 2, 3, 4.
      backoff: ${ALERT_DISPATCH_BACKOFF:10s,60s,300s}
      # After this many consecutive failures to one host its deliveries pause, so a dead receiver cannot hold the
      # dispatcher.
      host-failure-threshold: ${ALERT_HOST_FAILURE_THRESHOLD:5}
      host-pause: ${ALERT_HOST_PAUSE:60s}
      # Hard limit for one delivery, DNS lookup included.
      delivery-timeout: ${ALERT_DELIVERY_TIMEOUT:20s}
    webhook:
      # HMAC-SHA256 key for X-Pulseboard-Signature. Empty switches the WEBHOOK channel off; otherwise at least 32
      # characters. Never defaulted, never logged.
      signing-secret: ${ALERT_WEBHOOK_SIGNING_SECRET:}
      # Both switches weaken the protection against server-side request forgery; they are refused at startup
      # unless the test or local profile is active.
      allow-http: ${ALERT_WEBHOOK_ALLOW_HTTP:false}
      allow-private-targets: ${ALERT_WEBHOOK_ALLOW_PRIVATE_TARGETS:false}
      allowed-ports: ${ALERT_WEBHOOK_ALLOWED_PORTS:443}
      connect-timeout: ${ALERT_WEBHOOK_CONNECT_TIMEOUT:5s}
      read-timeout: ${ALERT_WEBHOOK_READ_TIMEOUT:5s}
  stream:
    # Live anomaly streams (server-sent events): concurrent connections per tenant and per instance.
    max-per-tenant: ${ANOMALY_STREAM_MAX_PER_TENANT:10}
    max-total: ${ANOMALY_STREAM_MAX_TOTAL:500}
    # Keep-alive comment while a stream is idle; a dead client is noticed by the failing write.
    heartbeat-interval: ${ANOMALY_STREAM_HEARTBEAT:30s}
    # A stream is closed after this long (or earlier, when its access token expires); clients reconnect.
    max-lifetime: ${ANOMALY_STREAM_MAX_LIFETIME:30m}
    ticket:
      # One-time ticket that lets a browser EventSource (no Authorization header) open the stream.
      ttl: ${STREAM_TICKET_TTL:30s}
      # Tickets one user may request: 30 per minute.
      issue-capacity: ${STREAM_TICKET_ISSUE_CAPACITY:30}
      issue-period: ${STREAM_TICKET_ISSUE_PERIOD:1m}

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: false

logging:
  level:
    io.pulseboard: DEBUG

# Developer workstation only: full health details help diagnose local Postgres/Redis wiring.
management:
  endpoint:
    health:
      show-details: always
      show-components: always

---
spring:
  config:
    activate:
      on-profile: test

logging:
  level:
    io.pulseboard: DEBUG
    org.testcontainers: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:pulseboard}
  data:
    redis:
      host: ${REDIS_HOST:redis}

logging:
  level:
    root: INFO
    io.pulseboard: INFO

# Container deployments never expose health internals to anonymous callers.
management:
  endpoint:
    health:
      show-details: never
      show-components: never
