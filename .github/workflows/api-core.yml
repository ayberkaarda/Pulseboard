name: api-core

on:
  push:
    paths:
      - "apps/api-core/**"
      - "contracts/**"
      - ".github/workflows/api-core.yml"
  pull_request:
    paths:
      - "apps/api-core/**"
      - "contracts/**"
      - ".github/workflows/api-core.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon
      - name: Test
        run: ./gradlew test --no-daemon
      - name: OpenAPI contract drift check
        # Uses Testcontainers, which needs the Docker daemon available on ubuntu-latest runners.
        run: ./gradlew verifyOpenApiDocs --no-daemon
