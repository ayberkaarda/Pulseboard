openapi: 3.1.0
info:
  title: Pulseboard Analytics
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      description: Return liveness without requiring external services.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
        version:
          type: string
          title: Version
      type: object
      required:
      - status
      - version
      title: HealthResponse
      description: Service liveness and installed package version.
