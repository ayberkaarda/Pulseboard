openapi: 3.1.0
info:
  description: "Identity, tenancy, metric ingestion and queries, anomalies and their\
    \ live stream. Errors are RFC 9457 problem details (application/problem+json)."
  title: Pulseboard api-core
  version: 0.7.0
servers:
- description: Same origin
  url: /
tags:
- description: "Service to service endpoints, not part of the public API. Authenticated\
    \ with an HMAC signature of the body, never with a JWT or an API key."
  name: internal
paths:
  /api/v1/alert-events:
    get:
      description: "Alert events of the caller's tenant, newest first (trigger time,\
        \ then id, both descending), so consecutive pages never overlap. `from` (inclusive)\
        \ and `to` (exclusive) filter on the trigger time. At most 100 per page."
      operationId: listAlertEvents
      parameters:
      - description: Only events of this rule.
        in: query
        name: ruleId
        required: false
        schema:
          type: string
          format: uuid
      - description: Only events with this delivery status.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - SENT
          - FAILED
      - description: "Inclusive lower bound of the trigger time, RFC 3339 (encode\
          \ '+' as %2B)."
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: "Exclusive upper bound of the trigger time, RFC 3339 (encode\
          \ '+' as %2B)."
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - description: Zero-based page number.
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: "Page size, 1 to 100."
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEventPage"
          description: One page of alert events
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid filter or paging parameter
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not authenticated as a user
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: List alert events
      tags:
      - Alert events
  /api/v1/alert-events/{id}:
    get:
      operationId: getAlertEvent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEvent"
          description: The event
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not authenticated as a user
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No such event for the caller's tenant
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: Read one alert event
      tags:
      - Alert events
  /api/v1/alert-rules:
    get:
      description: "All rules of the caller's tenant, oldest first (a tenant owns\
        \ at most 50 by default)."
      operationId: listAlertRules
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertRule"
          description: The rules
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not a user of the tenant, or not an OWNER or ADMIN for a change"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: List alert rules
      tags:
      - Alert rules
    post:
      description: OWNER and ADMIN only. A WEBHOOK target is checked against server-side
        request forgery rules before it is stored (see the `target` field) and again
        for every delivery.
      operationId: createAlertRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
          description: The rule was created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Invalid field, unknown metric or unacceptable webhook target"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not a user of the tenant, or not an OWNER or ADMIN for a change"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The name is taken (type conflict) or the tenant has the maximum
            number of rules (type alert-rule-limit)
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: Create an alert rule
      tags:
      - Alert rules
  /api/v1/alert-rules/{id}:
    delete:
      description: OWNER and ADMIN only. The events of the rule are deleted with it.
      operationId: deleteAlertRule
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The rule was deleted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not a user of the tenant, or not an OWNER or ADMIN for a change"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No such rule for the caller's tenant
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: Delete an alert rule
      tags:
      - Alert rules
    get:
      operationId: getAlertRule
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
          description: The rule
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not a user of the tenant, or not an OWNER or ADMIN for a change"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No such rule for the caller's tenant
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: Read one alert rule
      tags:
      - Alert rules
    patch:
      description: OWNER and ADMIN only. Without `version` the flag is simply set.
      operationId: setAlertRuleEnabled
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleEnabledRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
          description: The updated rule
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`enabled` is missing'
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not a user of the tenant, or not an OWNER or ADMIN for a change"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No such rule for the caller's tenant
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Stale version (type version-conflict)
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: Enable or disable an alert rule
      tags:
      - Alert rules
    put:
      description: "OWNER and ADMIN only. Optimistic concurrency: `version` must be\
        \ the version that was read; if the rule changed meanwhile the answer is 409\
        \ (type version-conflict)."
      operationId: updateAlertRule
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
          description: The updated rule
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Invalid field, unknown metric or unacceptable webhook target"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not a user of the tenant, or not an OWNER or ADMIN for a change"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No such rule for the caller's tenant
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Stale version (type version-conflict) or the name is taken
            (type conflict)
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: Replace an alert rule
      tags:
      - Alert rules
  /api/v1/anomalies:
    get:
      description: "Anomalies of the caller's tenant, newest window first (window\
        \ start, then id, both descending), so consecutive pages never overlap. `from`\
        \ (inclusive) and `to` (exclusive) filter on the window start. At most 100\
        \ per page."
      operationId: list
      parameters:
      - description: Only anomalies of this metric.
        in: query
        name: metricId
        required: false
        schema:
          type: string
          format: uuid
      - description: Only anomalies of metrics of this service.
        in: query
        name: serviceId
        required: false
        schema:
          type: string
          format: uuid
      - description: Only anomalies of this severity.
        in: query
        name: severity
        required: false
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
      - description: "true: only acknowledged anomalies, false: only open ones."
        in: query
        name: acknowledged
        required: false
        schema:
          type: boolean
      - description: "Inclusive lower bound of the window start, RFC 3339 (encode\
          \ '+' as %2B)."
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: "Exclusive upper bound of the window start, RFC 3339 (encode\
          \ '+' as %2B)."
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - description: Zero-based page number.
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: "Page size, 1 to 100."
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyPage"
          description: One page of anomalies
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid filter or paging parameter
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not authenticated as a user
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: List anomalies
      tags:
      - Anomalies
  /api/v1/anomalies/{id}:
    get:
      operationId: get
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anomaly"
          description: The anomaly
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not authenticated as a user
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No such anomaly for the caller's tenant
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: Read one anomaly
      tags:
      - Anomalies
  /api/v1/anomalies/{id}/ack:
    post:
      description: "OWNER and ADMIN only. Idempotent: the first acknowledgement is\
        \ kept, a later call returns the stored state with 200 and changes nothing."
      operationId: acknowledge
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anomaly"
          description: The acknowledged anomaly
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not an OWNER or ADMIN user
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No such anomaly for the caller's tenant
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The acknowledging user no longer exists
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
      security:
      - bearerAuth: []
      summary: Acknowledge an anomaly
      tags:
      - Anomalies
  /api/v1/api-keys:
    post:
      operationId: issue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreatedResponse"
          description: Created
      security:
      - bearerAuth: []
      tags:
      - API keys
  /api/v1/api-keys/{id}:
    delete:
      operationId: revoke
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Revoked
      security:
      - bearerAuth: []
      tags:
      - API keys
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
      tags:
      - Authentication
  /api/v1/auth/logout:
    post:
      description: "Revokes the whole refresh-token family of the presented refresh\
        \ token, so neither it nor any token rotated from it can be exchanged again.\
        \ Needs no access token (it may already have expired; one that is sent is\
        \ ignored). Idempotent: an unknown, expired or already revoked token is answered\
        \ with 204 exactly like a valid one."
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "204":
          description: Session ended (or there was none)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Malformed body
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too many requests from this client
          headers:
            Retry-After:
              description: Seconds until a retry can succeed
              schema:
                type: integer
              style: simple
      summary: End the session
      tags:
      - Authentication
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
      tags:
      - Authentication
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Created
      tags:
      - Authentication
  /api/v1/ingest:
    post:
      description: "Stores up to 1000 points. Points that cannot be stored (unknown\
        \ metric, timestamp outside the storable range, value not finite or |value|\
        \ > 1e100, duplicate of a later point with the same metricId and ts) are listed\
        \ in `rejected`; the others are stored. An existing sample with the same metric\
        \ and timestamp is overwritten. Rate limited per tenant (defaults: FREE 60,\
        \ PRO 600 batches per minute) and, before the key is looked up, per client\
        \ address (all API key requests, and failed API key authentications separately)."
      operationId: ingest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricBatch"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
          description: Batch processed
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not JSON or violates the batch schema
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Missing, invalid or revoked API key"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not authenticated with an API key
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Storage changed while the batch was written (for example a
            partition was removed); nothing was stored
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Body larger than the configured limit
        "415":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Content type is not application/json
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Tenant or client rate limit exceeded
          headers:
            Retry-After:
              description: Seconds until a retry can succeed
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Rate limiter unavailable (fails closed) or the batch lost\
            \ a lock conflict with a concurrent write (type concurrency-conflict;\
            \ nothing was stored, retry)"
          headers:
            Retry-After:
              description: Seconds until a retry can succeed
              schema:
                type: integer
              style: simple
      security:
      - apiKey: []
      summary: Ingest a batch of metric points
      tags:
      - Ingestion
  /api/v1/metrics/{metricId}:
    get:
      description: The same representation as the items of a service's metric list
        (it carries the serviceId). 404 when the id is unknown or belongs to another
        tenant (identical responses).
      operationId: getMetric
      parameters:
      - in: path
        name: metricId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricDefinitionResponse"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No such metric for the caller's tenant
      security:
      - bearerAuth: []
      summary: Get a metric definition
      tags:
      - Metrics
  /api/v1/metrics/{metricId}/points:
    get:
      description: "Buckets of `step` aligned to the Unix epoch, combined with the\
        \ metric's aggregation (AVG, SUM, MAX or P95 as a continuous percentile).\
        \ Covers `from <= ts < to`; buckets without samples are omitted. At most 2000\
        \ buckets: without `step` the smallest step of 1s, 5s, 10s, 15s, 30s, 1m,\
        \ 2m, 5m, 10m, 15m, 30m, 1h, 2h, 3h, 6h, 12h, 1d, 2d or 7d that fits is used;\
        \ an explicit step that would yield more buckets is rejected with 400. Limits:\
        \ the range covers at most 366 days, from/to lie between 1970-01-01T00:00:00Z\
        \ and 9999-12-31T23:59:59Z, step is whole seconds between PT1S and P366D.\
        \ from/to are rounded up to whole microseconds (the storage precision) and\
        \ echoed normalised. Rate limited per tenant (default 120 queries per minute);\
        \ each query runs under a statement timeout (default 5 s)."
      operationId: points
      parameters:
      - in: path
        name: metricId
        required: true
        schema:
          type: string
          format: uuid
      - description: "Inclusive start, RFC 3339 date-time (encode '+' as %2B)."
        in: query
        name: from
        required: true
        schema:
          type: string
          format: date-time
      - description: "Exclusive end, RFC 3339 date-time (encode '+' as %2B)."
        in: query
        name: to
        required: true
        schema:
          type: string
          format: date-time
      - description: "Bucket width as an ISO 8601 duration of whole seconds, at least\
          \ PT1S."
        in: query
        name: step
        required: false
        schema:
          type: string
          example: PT5M
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricPoints"
          description: Downsampled series
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid range or step
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not authenticated as a user
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No such metric for the caller's tenant
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: An aggregate of the stored samples exceeds the double range
            (type aggregate-out-of-range; not reachable with values accepted by ingestion)
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Tenant query rate limit exceeded
          headers:
            Retry-After:
              description: Seconds until a retry can succeed
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Query exceeded the statement timeout (type query-timeout) or
            the rate limiter is unavailable
          headers:
            Retry-After:
              description: Seconds until a retry can succeed
              schema:
                type: integer
              style: simple
      security:
      - bearerAuth: []
      summary: Read a metric downsampled on the server
      tags:
      - Metrics
  /api/v1/services:
    get:
      operationId: listServices
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceResponse"
          description: OK
      security:
      - bearerAuth: []
      - apiKey: []
      tags:
      - Services
    post:
      operationId: createService
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
          description: Created
      security:
      - bearerAuth: []
      - apiKey: []
      tags:
      - Services
  /api/v1/services/{serviceId}:
    get:
      description: 404 when the id is unknown or belongs to another tenant (identical
        responses).
      operationId: getService
      parameters:
      - in: path
        name: serviceId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No such service for the caller's tenant
      security:
      - bearerAuth: []
      - apiKey: []
      summary: Get a service
      tags:
      - Services
  /api/v1/services/{serviceId}/metrics:
    get:
      operationId: listMetrics
      parameters:
      - in: path
        name: serviceId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricDefinitionResponse"
          description: OK
      security:
      - bearerAuth: []
      - apiKey: []
      tags:
      - Services
    post:
      operationId: createMetric
      parameters:
      - in: path
        name: serviceId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMetricRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricDefinitionResponse"
          description: Created
      security:
      - bearerAuth: []
      - apiKey: []
      tags:
      - Services
  /api/v1/stream/anomalies:
    get:
      description: "Server-sent events (`text/event-stream`) for the caller's tenant\
        \ only. Each anomaly is one event named `anomaly` whose `id` is the anomaly\
        \ id and whose data is the Anomaly JSON document. A comment line `: ping`\
        \ is sent every 30 seconds (configurable) while idle. Authenticate with exactly\
        \ one of: the bearer access token, or a one-time `ticket` query parameter\
        \ from POST /api/v1/stream/ticket (for a browser EventSource, which cannot\
        \ set the header). A request with both, or with an invalid, expired, malformed\
        \ or already used ticket, is answered with the same 401; a ticket is used\
        \ up even when the request is then refused (for example with 429), so request\
        \ a new one for every connection attempt. Access tokens in the query string\
        \ are not accepted. The stream ends when the access token (the one that requested\
        \ the ticket, for ticket streams) expires or after at most 30 minutes (configurable);\
        \ reconnect with a fresh token or ticket. Events published while disconnected\
        \ are not replayed: read GET /api/v1/anomalies after reconnecting. Limited\
        \ per tenant and per instance (defaults 10 and 500)."
      operationId: stream
      parameters:
      - description: "One-time stream ticket from POST /api/v1/stream/ticket, as an\
          \ alternative to the Authorization header. Consumed by the request. Never\
          \ log or store it."
        in: query
        name: ticket
        schema:
          type: string
          maxLength: 43
          minLength: 43
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: Event stream
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Missing or invalid credentials, both credentials at once,\
            \ or an invalid ticket"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not authenticated as a user
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too many open streams for the tenant or the server
          headers:
            Retry-After:
              description: Seconds until a retry can succeed
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The message bus is unavailable
          headers:
            Retry-After:
              description: Seconds until a retry can succeed
              schema:
                type: integer
              style: simple
      security:
      - bearerAuth: []
      - streamTicket: []
      summary: Stream new anomalies
      tags:
      - Anomalies
  /api/v1/stream/ticket:
    post:
      description: "Returns a one-time ticket for GET /api/v1/stream/anomalies?ticket=...,\
        \ for clients that cannot send an Authorization header (a browser EventSource).\
        \ The ticket is valid for 30 seconds (configurable) or until the access token\
        \ expires, whichever is sooner, is bound to the caller's tenant and user,\
        \ and can be used exactly once. The stream opened with it ends when the access\
        \ token that requested the ticket expires. Only the SHA-256 digest of the\
        \ ticket is stored. Limited to 30 tickets per user per minute. Requires a\
        \ user access token; API keys are refused. The response is never cached."
      operationId: issueStreamTicket
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamTicketResponse"
          description: Ticket issued
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not authenticated as a user (for example an API key)
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too many tickets requested
          headers:
            Retry-After:
              description: Seconds until a retry can succeed
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The ticket store or rate limiter is unavailable (fails closed)
          headers:
            Retry-After:
              description: Seconds until a retry can succeed
              schema:
                type: integer
              style: simple
      security:
      - bearerAuth: []
      summary: Issue a stream ticket
      tags:
      - Anomalies
  /internal/v1/anomalies/notify:
    post:
      description: "Called by the analytics service after it inserted anomalies. The\
        \ body follows contracts/events/anomaly-detected.schema.json (1 to 500 entries,\
        \ at most 512 KiB). Only the id and tenantId of each entry are used: every\
        \ id is read again from the database together with that tenant, and what the\
        \ database holds is published to the live streams of the tenant. Ids that\
        \ do not exist, or that belong to another tenant than claimed, are counted\
        \ in `unknown` and nothing is published for them. Nothing is inserted, so\
        \ a replay is harmless. Publishing is not atomic: when the message bus fails\
        \ part-way the call answers 503 after some entries were already published,\
        \ and a retry publishes those again. Live streams therefore may deliver an\
        \ anomaly more than once; the event id of every stream event is the anomaly\
        \ id, which clients use to drop duplicates."
      operationId: notifyAnomalies
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnomalyDetectedNotification"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyNotificationResult"
          description: Notification processed
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not JSON or violates the notification schema
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "X-Internal-Signature missing, malformed or wrong"
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Body larger than the configured limit
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unexpected error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The message bus is unavailable; retry
      security:
      - internalHmac: []
      summary: Announce newly stored anomalies
      tags:
      - internal
components:
  schemas:
    AlertEvent:
      type: object
      description: "An alert that was raised, with its delivery state. Delivery is\
        \ at least once: a receiver should deduplicate on `id`."
      properties:
        attempts:
          type: integer
          format: int32
          description: Delivery attempts started so far.
        deliveredAt:
          type:
          - string
          - "null"
          format: date-time
          description: Null unless SENT.
        deliveryStatus:
          type: string
          enum:
          - PENDING
          - SENT
          - FAILED
        id:
          type: string
          format: uuid
        lastError:
          type:
          - string
          - "null"
          description: "Reason of the last failed attempt (a status code or an error\
            \ class, never a URL or a response body)."
        nextAttemptAt:
          type:
          - string
          - "null"
          format: date-time
          description: When the next attempt is due; null unless PENDING.
        payload:
          type: object
          additionalProperties: true
          description: The document that is delivered to the receiver.
        ruleId:
          type: string
          format: uuid
        ruleName:
          type: string
          description: Current name of the rule.
        sourceRef:
          type: string
          description: "What caused the event: the timestamp of the metric point or\
            \ the id of the anomaly. Unique per rule."
        triggeredAt:
          type: string
          format: date-time
      required:
      - attempts
      - deliveredAt
      - deliveryStatus
      - id
      - lastError
      - nextAttemptAt
      - payload
      - ruleId
      - ruleName
      - sourceRef
      - triggeredAt
    AlertEventPage:
      type: object
      description: "One page of alert events, newest first."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlertEvent"
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: Requested page size.
        totalItems:
          type: integer
          format: int64
          description: Number of events that match the filters.
        totalPages:
          type: integer
          format: int64
          description: Number of pages of this size.
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
    AlertRule:
      type: object
      description: An alert rule of the caller's tenant.
      properties:
        channel:
          type: string
          enum:
          - WEBHOOK
          - EMAIL_LOG
        condition:
          type: string
          enum:
          - THRESHOLD
          - ANOMALY_SEVERITY
        cooldownSeconds:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        createdBy:
          type:
          - string
          - "null"
          format: uuid
          description: Creating user; null once that user was deleted.
        enabled:
          type: boolean
        id:
          type: string
          format: uuid
        metricId:
          type: string
          format: uuid
        metricName:
          type: string
          description: Name of the metric.
        metricUnit:
          type: string
          description: Unit of the metric.
        minSeverity:
          type:
          - string
          - "null"
          description: Null unless ANOMALY_SEVERITY.
          enum:
          - LOW
          - MEDIUM
          - HIGH
        name:
          type: string
        operator:
          type:
          - string
          - "null"
          description: Null unless THRESHOLD.
          enum:
          - GT
          - GTE
          - LT
          - LTE
        serviceName:
          type: string
          description: Name of the service that owns the metric.
        target:
          type: string
          description: Webhook URL or e-mail label. Only visible to authenticated
            users of the tenant; never written to logs in full.
        threshold:
          type:
          - number
          - "null"
          format: double
          description: Null unless THRESHOLD.
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Changes with every update; send it back with a change.
      required:
      - channel
      - condition
      - cooldownSeconds
      - createdAt
      - createdBy
      - enabled
      - id
      - metricId
      - metricName
      - metricUnit
      - minSeverity
      - name
      - operator
      - serviceName
      - target
      - threshold
      - updatedAt
      - version
    AlertRuleEnabledRequest:
      type: object
      properties:
        enabled:
          type: boolean
        version:
          type: integer
          format: int64
          description: "When given, the change is only applied if the rule still has\
            \ this version."
      required:
      - enabled
    AlertRuleRequest:
      type: object
      description: Fields of an alert rule. THRESHOLD rules need `operator` and `threshold`
        and no `minSeverity`; ANOMALY_SEVERITY rules need `minSeverity` and neither
        of the others.
      properties:
        channel:
          type: string
          enum:
          - WEBHOOK
          - EMAIL_LOG
        condition:
          type: string
          enum:
          - THRESHOLD
          - ANOMALY_SEVERITY
        cooldownSeconds:
          type: integer
          format: int32
          description: Seconds after a firing during which the rule stays silent.
          maximum: 86400
          minimum: 60
        enabled:
          type: boolean
          default: true
          description: Defaults to true.
        metricId:
          type: string
          format: uuid
          description: Metric to watch; it must belong to the caller's tenant.
        minSeverity:
          type: string
          description: "ANOMALY_SEVERITY only: the rule fires for this severity and\
            \ above."
          enum:
          - LOW
          - MEDIUM
          - HIGH
        name:
          type: string
          description: "Unique per tenant, 1 to 100 characters."
          maxLength: 100
        operator:
          type: string
          description: "THRESHOLD only: how a stored value is compared with the threshold."
          enum:
          - GT
          - GTE
          - LT
          - LTE
        target:
          type: string
          description: "WEBHOOK: https URL of the receiver (a DNS name, no credentials,\
            \ port 443 unless configured otherwise, must not resolve to a private\
            \ or otherwise internal address). EMAIL_LOG: a recipient label of up to\
            \ 254 characters."
          maxLength: 2048
        threshold:
          type: number
          format: double
          description: "THRESHOLD only: finite number."
      required:
      - channel
      - condition
      - cooldownSeconds
      - metricId
      - name
      - target
    AlertRuleUpdateRequest:
      type: object
      description: "Replaces all fields of an alert rule. `version` is the version\
        \ that was read; when the rule has changed since, the answer is 409."
      properties:
        channel:
          type: string
          enum:
          - WEBHOOK
          - EMAIL_LOG
        condition:
          type: string
          enum:
          - THRESHOLD
          - ANOMALY_SEVERITY
        cooldownSeconds:
          type: integer
          format: int32
          maximum: 86400
          minimum: 60
        enabled:
          type: boolean
          default: true
          description: Defaults to true.
        metricId:
          type: string
          format: uuid
        minSeverity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        name:
          type: string
          maxLength: 100
        operator:
          type: string
          enum:
          - GT
          - GTE
          - LT
          - LTE
        target:
          type: string
          maxLength: 2048
        threshold:
          type: number
          format: double
        version:
          type: integer
          format: int64
          description: Version of the rule this change is based on.
      required:
      - channel
      - condition
      - cooldownSeconds
      - metricId
      - name
      - target
      - version
    Anomaly:
      type: object
      description: A scored window of a metric that a detector flagged. The same representation
        is the data of every server-sent event on /api/v1/stream/anomalies.
      properties:
        acknowledgedAt:
          type:
          - string
          - "null"
          format: date-time
          description: When the anomaly was acknowledged; null while it is open.
        acknowledgedBy:
          type:
          - string
          - "null"
          format: uuid
          description: "User that acknowledged the anomaly; null while it is open,\
            \ or when that user was deleted afterwards."
        createdAt:
          type: string
          format: date-time
          description: When the anomaly was stored.
        details:
          type: object
          additionalProperties: true
          description: Detector specific details.
        detector:
          type: string
          enum:
          - ZSCORE
          - ISOLATION_FOREST
        id:
          type: string
          format: uuid
        metricId:
          type: string
          format: uuid
        metricName:
          type: string
          description: Name of the metric.
        score:
          type: number
          format: double
          description: Anomaly score between 0 and 1.
          maximum: 1
          minimum: 0
        serviceId:
          type: string
          format: uuid
          description: Service that owns the metric.
        serviceName:
          type: string
          description: Name of the service that owns the metric.
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        tenantId:
          type: string
          format: uuid
        windowEnd:
          type: string
          format: date-time
          description: End of the scored window.
        windowStart:
          type: string
          format: date-time
          description: Inclusive start of the scored window.
      required:
      - acknowledgedAt
      - acknowledgedBy
      - createdAt
      - details
      - detector
      - id
      - metricId
      - metricName
      - score
      - serviceId
      - serviceName
      - severity
      - tenantId
      - windowEnd
      - windowStart
    AnomalyDetectedItem:
      type: object
      additionalProperties: false
      description: One stored anomaly. Only id and tenantId are used by the server;
        the other members are informational.
      properties:
        createdAt:
          type: string
          format: date-time
        detector:
          type: string
          enum:
          - ZSCORE
          - ISOLATION_FOREST
        id:
          type: string
          format: uuid
        metricId:
          type: string
          format: uuid
        score:
          type: number
          format: double
          maximum: 1
          minimum: 0
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        tenantId:
          type: string
          format: uuid
        windowEnd:
          type: string
          format: date-time
        windowStart:
          type: string
          format: date-time
      required:
      - createdAt
      - detector
      - id
      - metricId
      - score
      - severity
      - tenantId
      - windowEnd
      - windowStart
    AnomalyDetectedNotification:
      type: object
      additionalProperties: false
      description: Anomalies the analytics service just stored (contracts/events/anomaly-detected.schema.json).
      properties:
        anomalies:
          type: array
          items:
            $ref: "#/components/schemas/AnomalyDetectedItem"
          maxItems: 500
          minItems: 1
      required:
      - anomalies
    AnomalyNotificationResult:
      type: object
      properties:
        accepted:
          type: integer
          format: int32
          description: Distinct anomalies found in the database and published.
        unknown:
          type: integer
          format: int32
          description: Distinct entries whose id does not exist or belongs to another
            tenant than the one claimed.
      required:
      - accepted
      - unknown
    AnomalyPage:
      type: object
      description: "One page of anomalies, newest window first."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Anomaly"
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: Requested page size.
        totalItems:
          type: integer
          format: int64
          description: Number of anomalies that match the filters.
        totalPages:
          type: integer
          format: int64
          description: Number of pages of this size.
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
    ApiKeyCreatedResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        prefix:
          type: string
      required:
      - createdAt
      - id
      - key
      - name
      - prefix
    CreateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - name
    CreateMetricRequest:
      type: object
      properties:
        aggregation:
          type: string
          enum:
          - AVG
          - SUM
          - MAX
          - P95
        name:
          type: string
          maxLength: 100
          minLength: 0
          pattern: "^[a-z][a-z0-9_.]*$"
        unit:
          type: string
          maxLength: 32
          minLength: 0
      required:
      - aggregation
      - name
      - unit
    CreateServiceRequest:
      type: object
      properties:
        environment:
          type: string
          enum:
          - PROD
          - STAGING
          - DEV
        name:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - environment
      - name
    IngestResponse:
      type: object
      description: Outcome of an ingestion batch.
      properties:
        accepted:
          type: integer
          format: int32
          description: Number of points stored (rows written); accepted + rejected
            = points sent.
        rejected:
          type: array
          description: "Points that were not stored, in ascending index order."
          items:
            $ref: "#/components/schemas/RejectedPoint"
      required:
      - accepted
      - rejected
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 320
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 0
        tenantSlug:
          type: string
          maxLength: 63
          minLength: 0
      required:
      - email
      - password
      - tenantSlug
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 256
          minLength: 0
      required:
      - refreshToken
    MetricBatch:
      type: object
      additionalProperties: false
      description: A batch of metric points (contracts/events/metric-batch.schema.json).
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/MetricPoint"
          maxItems: 1000
          minItems: 1
        source:
          type: string
          description: Optional identifier of the sender.
          maxLength: 128
          minLength: 1
      required:
      - points
    MetricDefinitionResponse:
      type: object
      properties:
        aggregation:
          type: string
          enum:
          - AVG
          - SUM
          - MAX
          - P95
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        serviceId:
          type: string
          format: uuid
        unit:
          type: string
      required:
      - aggregation
      - createdAt
      - id
      - name
      - serviceId
      - unit
    MetricPoint:
      type: object
      additionalProperties: false
      description: One sample of a metric.
      properties:
        metricId:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
          description: RFC 3339 date-time with an offset; stored with microsecond
            precision.
        value:
          type: number
          format: double
          description: "A finite number with |value| <= 1e100. A larger magnitude\
            \ or a number beyond the double range rejects only this point (listed\
            \ in `rejected`), not the batch."
      required:
      - metricId
      - ts
      - value
    MetricPointBucket:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: Number of samples in the bucket.
        ts:
          type: string
          format: date-time
          description: Start of the bucket (epoch-aligned; the first bucket may start
            before from).
        value:
          type:
          - number
          - "null"
          format: double
          description: Aggregated value of the bucket; null when the aggregate is
            not a finite number (not reachable with values accepted by ingestion).
      required:
      - count
      - ts
      - value
    MetricPoints:
      type: object
      description: A metric downsampled into epoch-aligned buckets.
      properties:
        aggregation:
          type: string
          description: How the samples of each bucket are combined (from the metric
            definition).
          enum:
          - AVG
          - SUM
          - MAX
          - P95
        from:
          type: string
          format: date-time
          description: "Inclusive start of the queried range, rounded up to whole\
            \ microseconds."
        metricId:
          type: string
          format: uuid
        points:
          type: array
          description: Non-empty buckets in ascending order; at most 2000.
          items:
            $ref: "#/components/schemas/MetricPointBucket"
        step:
          type: string
          description: Bucket width used (ISO 8601 duration).
          example: PT5M
        to:
          type: string
          format: date-time
          description: "Exclusive end of the queried range, rounded up to whole microseconds."
      required:
      - aggregation
      - from
      - metricId
      - points
      - step
      - to
    Problem:
      type: object
      description: RFC 9457 problem details (application/problem+json).
      properties:
        detail:
          type: string
        errors:
          type: array
          description: "Present on validation problems: one entry per violation."
          items:
            $ref: "#/components/schemas/ProblemFieldError"
        instance:
          type: string
          description: Request path.
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          description: "Problem type URI, urn:pulseboard:problem:<kind>."
          example: urn:pulseboard:problem:validation
      required:
      - status
      - title
      - type
    ProblemFieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 256
          minLength: 0
      required:
      - refreshToken
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 12
        tenantName:
          type: string
          maxLength: 200
          minLength: 0
        tenantSlug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
      required:
      - email
      - password
      - tenantName
      - tenantSlug
    RejectedPoint:
      type: object
      properties:
        index:
          type: integer
          format: int32
          description: Zero-based index of the point in the batch.
        reason:
          type: string
          description: "Why the point was not stored: unknown metric | timestamp is\
            \ outside the range accepted for storage | timestamp cannot be represented\
            \ | value must be a finite number | value magnitude must not exceed 1e100\
            \ | superseded by a later point with the same metricId and ts."
          example: unknown metric
      required:
      - index
      - reason
    ServiceResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        environment:
          type: string
          enum:
          - PROD
          - STAGING
          - DEV
        id:
          type: string
          format: uuid
        lastPointAt:
          type:
          - string
          - "null"
          format: date-time
          description: Timestamp of the newest sample over all metrics of the service;
            null while the service has no samples.
        name:
          type: string
      required:
      - createdAt
      - environment
      - id
      - lastPointAt
      - name
    StreamTicketResponse:
      type: object
      properties:
        expiresInSeconds:
          type: integer
          format: int64
          description: Seconds the ticket can still be used
          example: 30
        ticket:
          type: string
          description: "Opaque one-time value for the `ticket` query parameter of\
            \ the stream endpoint. 256 random bits, URL-safe base64 without padding.\
            \ Shown once; never log or store it."
      required:
      - expiresInSeconds
      - ticket
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: End of the refresh token's validity; never later than the end
            of the session (absolute refresh lifetime).
        role:
          type: string
        tenantId:
          type: string
          format: uuid
        tokenType:
          type: string
        userId:
          type: string
          format: uuid
      required:
      - accessToken
      - accessTokenExpiresAt
      - refreshToken
      - refreshTokenExpiresAt
      - role
      - tenantId
      - tokenType
      - userId
  securitySchemes:
    apiKey:
      description: Tenant API key from /api/v1/api-keys.
      in: header
      name: X-Api-Key
      type: apiKey
    bearerAuth:
      bearerFormat: JWT
      description: "Access token from /api/v1/auth/login, /register or /refresh."
      scheme: bearer
      type: http
    internalHmac:
      description: "Internal endpoints only. Lower-case hex HMAC-SHA256 of the raw\
        \ request body, keyed with INTERNAL_SHARED_SECRET. Missing, malformed or wrong\
        \ signatures are answered with 401."
      in: header
      name: X-Internal-Signature
      type: apiKey
    streamTicket:
      description: "GET /api/v1/stream/anomalies only. One-time ticket from POST /api/v1/stream/ticket,\
        \ an alternative to the bearer token; sending both is refused."
      in: query
      name: ticket
      type: apiKey
