[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "pulseboard-analytics"
dynamic = ["version"]
description = "Pulseboard analytics service"
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "fastapi>=0.162.2,<1",
    "uvicorn>=0.54,<1",
    "pydantic>=2.14.3,<3",
    "sqlalchemy>=2.1.8,<3",
    "psycopg[binary]>=3.3.8,<4",
    "apscheduler>=3.11.3,<4",
    "numpy>=2.5.4,<3",
    "pandas>=3.1.1,<4",
    "scikit-learn>=1.9.1,<2",
    "httpx2>=2.16,<3",
    "structlog>=26.1,<27",
    "redis>=8.1,<9",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17.4,<1",
    "mypy>=2.4.1,<3",
    "testcontainers[postgres]>=4.15,<5",
    "httpx2>=2.16,<3",
    "types-pyyaml>=6,<7",
    "pandas-stubs>=3.1,<4",
]

[tool.hatch.version]
path = "pulseboard_analytics/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pulseboard_analytics"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["pulseboard_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.mypy.overrides]]
module = ["apscheduler.*", "sklearn.*"]
ignore_missing_imports = true
